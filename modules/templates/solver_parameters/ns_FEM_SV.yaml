solver_parameters:
  mat_type: aij

  # Solve linearized system only
  snes_type: ksponly

  # Krylov solver
  ksp_type: fgmres
  ksp_rtol: 1e-6
  ksp_atol: 1e-12
  #ksp_max_it: 500
  ksp_gmres_restart: 200

  # Block Schur
  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: full # changed from lower
  pc_fieldsplit_schur_precondition: selfp
  pc_fieldsplit_schur_scale: -1 # added this

  # Velocity block (V)
  fieldsplit_0_ksp_type: preonly
  fieldsplit_0_pc_type: hypre
  fieldsplit_0_pc_hypre_type: boomeramg
  fieldsplit_0_pc_hypre_boomeramg_strong_threshold: 0.5
  fieldsplit_0_pc_hypre_boomeramg_relax_type_all: symmetric-SOR/Jacobi
  fieldsplit_0_pc_hypre_boomeramg_max_iter: 20
  fieldsplit_0_pc_hypre_boomeramg_cycle_type: V

  # Pressure block (DG mass)
  fieldsplit_1_ksp_type: preonly
  fieldsplit_1_pc_type: jacobi # tested hypre = required much more ksp its