t0: 0.0             # initial time
T: 5.0              # final time
dt: 0.0005           # time-step
theta: 0.5          # theta constant
gamma: 0.0          # grad-div stabilization constant
Re: 600.0           # Reynold's num: 1/viscostiy
G: 0.0              # initial pressure gauge
P: -1.0             # pressure strength (P*x + G)
alpha: 1.0          # Voigt constant alpha

solver: "BDF2"      # valid:  "BDF2" (Backward Differentiation) or 
                    #         "CN" (Crank-Nicolson)
elements: "SV"      # valid:  "SV" (Scott Vogelius - requires barycentric refinement) or 
                    #         "TH" (Taylor Hood)
views: "None"       # valid:  "Full" for debugging by viewing ALL solver parameters, 
                    #         "Some" for debugging by monitoring subprocesses like KSP, 
                    #         "None" for no debugging

char_length: 1.0    # characteristic length: use for bluff bodies, airfoils, etc.

# probe types
step: [[4.8, 1], [4.9, 1.1], [4.7, 0.9], [4.8, 2], [4.9, 2.1], [4.7, 2.9],
       [6, 2], [6, 1.5], [4.7, 0.9], [10, 1.5], [11, 2], [12, 2], [13, 2.5], [14, 3], [15, 2.5]]

probes: step        # points to evaluate energy spectrum at, assuming Taylor's frozen flow hyp.