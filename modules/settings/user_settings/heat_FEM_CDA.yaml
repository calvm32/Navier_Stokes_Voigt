t0: 0.0           # initial time
T: 1.0            # final time
dt: 0.1           # timestepping length
theta: 0.5        # theta constant
N: 10             # mesh resolution
mu: 10            # CDA AOT variable

solver: "BDF2"      # valid:  "BDF2" (Backward Differentiation) or 
                    #         "CN" (Crank-Nicolson)