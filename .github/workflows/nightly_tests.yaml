name: Nightly Unit Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Runs at 02:00 UTC every day
  workflow_dispatch:     # Allows for manual run in GitHub

jobs:
  mms_tests:
    runs-on: ubuntu-latest
    container:
      image: firedrakeproject/firedrake:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and project
        run: |
          # GitHub Actions overrides Docker entrypoints, so we manually 
          # activate Firedrake's virtual environment before using pip/python
          . /home/calum/venv-firedrake
          
          # Install your repo's requirements rather than hardcoding them
          pip install -r requirements.txt
          pip install pytest
          pip install -e .

      - name: Run unit tests
        run: |
          . /home/calum/venv-firedrake
          
          # Run pytest
          pytest -v --maxfail=1