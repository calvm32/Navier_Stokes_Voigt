solver_parameters:
  mat_type: aij

  # Linearized Oseen solve
  snes_type: ksponly

  # Krylov
  ksp_type: fgmres
  ksp_rtol: 1e-5          # <-- key: loosen this
  ksp_atol: 1e-10
  ksp_max_it: 100
  ksp_norm_type: preconditioned
  ksp_pc_side: left
  ksp_gmres_restart: 30

  # Block Schur
  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: lower
  pc_fieldsplit_schur_precondition: selfp

  # Velocity block (cheap on purpose)
  fieldsplit_0_ksp_type: richardson
  fieldsplit_0_ksp_max_it: 1
  fieldsplit_0_pc_type: hypre
  fieldsplit_0_pc_hypre_type: boomeramg
  fieldsplit_0_pc_hypre_boomeramg_max_iter: 1
  fieldsplit_0_pc_hypre_boomeramg_cycle_type: V

  # Pressure block
  fieldsplit_1_ksp_type: preonly
  fieldsplit_1_pc_type: jacobi
