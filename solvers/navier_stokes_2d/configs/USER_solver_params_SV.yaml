solver_parameters:
  mat_type: matfree

  # SNES: disable nonlinear Newton
  snes_type: ksponly
  snes_monitor: null

  # Krylov solver
  ksp_type: fgmres
  ksp_rtol: 1e-6
  ksp_atol: 1e-12
  ksp_max_it: 150
  ksp_monitor_true_residual: null
  ksp_gmres_modifiedgramschmidt: null

  # Block preconditioner
  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: lower

  # THIS is the crucial fix for Scott–Vogelius
  pc_fieldsplit_schur_precondition: selfp

  # Velocity block (H1)
  fieldsplit_0_ksp_type: preonly
  fieldsplit_0_pc_type: python
  fieldsplit_0_pc_python_type: firedrake.AssembledPC
  fieldsplit_0_assembled_pc_type: hypre
  fieldsplit_0_assembled_pc_hypre_type: boomeramg

  # Optional but helps robustness
  fieldsplit_0_assembled_pc_hypre_boomeramg_max_iter: 1
  fieldsplit_0_assembled_pc_hypre_boomeramg_strong_threshold: 0.25

  # Pressure block (DG mass)
  fieldsplit_1_ksp_type: preonly
  fieldsplit_1_pc_type: python
  fieldsplit_1_pc_python_type: firedrake.AssembledPC
  fieldsplit_1_assembled_pc_type: hypre
  fieldsplit_1_assembled_pc_hypre_type: boomeramg
