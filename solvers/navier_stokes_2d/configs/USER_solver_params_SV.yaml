solver_parameters:
  # Nonlinear solver
  snes_type: ksponly
  snes_max_it: 50
  snes_max_funcs: 10000
  snes_rtol: 1e-8
  snes_atol: 1e-50
  snes_stol: 1e-8
  snes_norm_schedule: always

  # Linear solver
  ksp_type: fgmres
  ksp_max_it: 50
  ksp_rtol: 1e-6
  ksp_atol: 1e-12
  ksp_divtol: 1e4
  ksp_gmres_restart: 30
  ksp_initial_guess_nonzero: False
  ksp_norm_type: unpreconditioned
  ksp_pc_side: right

  # Preconditioner
  pc_type: lu
  pc_factor_shift_type: none  # implied by zero-pivot tolerance
  pc_factor_zero_pivot: 2.22045e-14
  pc_factor_mat_ordering_type: external

  # LU backend
  pc_factor_mat_solver_type: mumps