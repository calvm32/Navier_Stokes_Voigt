solver_parameters:
  # Nonlinear solver
  snes_type: ksponly

  # Linear solver
  ksp_type: fgmres

  # Preconditioner
  pc_type: lu
  pc_factor_shift_type: none  # implied by zero-pivot tolerance
  pc_factor_zero_pivot: 2.22045e-14
  pc_factor_mat_ordering_type: external

  # LU backend
  pc_factor_mat_solver_type: mumps