solver_parameters: 
  mat_type: matfree
  snes_monitor: null

  ksp_type: fgmres
  ksp_gmres_modifiedgramschmidt: null
  ksp_monitor_true_residual: null

  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: lower

  # ---- VELOCITY BLOCK ----
  fieldsplit_0_ksp_type: preonly
  fieldsplit_0_pc_type: python
  fieldsplit_0_pc_python_type: firedrake.AssembledPC
  fieldsplit_0_assembled_pc_type: hypre
  fieldsplit_0_assembled_pc_hypre_type: boomeramg
  fieldsplit_0_assembled_pc_hypre_max_iter: 1        # <<< new: AMG solve only 1 iteration, much cheaper
  fieldsplit_0_assembled_pc_hypre_tol: 1e-1         # <<< loose tolerance, still stable in most 2D flows

  # ---- PRESSURE BLOCK ----
  fieldsplit_1_ksp_type: fgmres
  fieldsplit_1_ksp_rtol: 5e-2                        # <<< slightly looser
  fieldsplit_1_ksp_max_it: 5                         # <<< reduce max iterations
  fieldsplit_1_pc_type: python
  fieldsplit_1_pc_python_type: firedrake.PCDPC

  fieldsplit_1_pcd_Mp_ksp_type: preonly
  fieldsplit_1_pcd_Mp_pc_type: jacobi

  fieldsplit_1_pcd_Kp_ksp_type: preonly
  fieldsplit_1_pcd_Kp_pc_type: hypre
  fieldsplit_1_pcd_Kp_hypre_max_iter: 1             # <<< only 1 iteration in inner AMG
  fieldsplit_1_pcd_Kp_hypre_tol: 1e-1              # <<< looser tolerance

  fieldsplit_1_pcd_Fp_mat_type: matfree
  fieldsplit_1_pcd_u: velocity
  fieldsplit_1_pcd_dt: "{dt}"

  pc_fieldsplit_schur_fact_type: lower
  reuse_amg: True
