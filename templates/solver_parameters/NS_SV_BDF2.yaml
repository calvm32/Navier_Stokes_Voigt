solver_parameters:

  mat_type: matfree
  pmat_type: aij

  # Nonlinear solver
  snes_type: ksponly

  # Krylov solver
  ksp_type: fgmres
  ksp_rtol: 1e-6
  ksp_atol: 1e-12
  ksp_max_it: 200
  ksp_monitor_true_residual: null
  ksp_gmres_modifiedgramschmidt: null

  # Preconditioner: Schur split
  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: lower
  pc_fieldsplit_schur_precondition: selfp

  # Velocity block (A)
  fieldsplit_0_ksp_type: preonly
  fieldsplit_0_pc_type: hypre
  fieldsplit_0_pc_hypre_type: boomeramg
  fieldsplit_0_pc_hypre_boomeramg_max_iter: 1
  fieldsplit_0_pc_hypre_boomeramg_relax_type_all: symmetric-SOR/Jacobi

  # Pressure block (Schur approx)
  fieldsplit_1_ksp_type: preonly
  fieldsplit_1_pc_type: hypre
  fieldsplit_1_pc_hypre_type: boomeramg
