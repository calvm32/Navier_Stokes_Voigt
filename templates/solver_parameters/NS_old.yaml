solver_parameters:

  # --------------------------------------------------
  # Linearized solve (Oseen)
  # --------------------------------------------------
  snes_type: ksponly
  snes_max_it: 1
  snes_rtol: 1e-8
  snes_atol: 1e-50
  snes_stol: 0.0
  snes_norm_schedule: always

  # --------------------------------------------------
  # Krylov solver
  # --------------------------------------------------
  ksp_type: fgmres
  ksp_max_it: 100
  ksp_rtol: 1e-8
  ksp_atol: 1e-12
  ksp_divtol: 1e4
  ksp_gmres_restart: 30

  # IMPORTANT for time stepping
  ksp_initial_guess_nonzero: true

  # REQUIRED for FGMRES + right PC
  ksp_pc_side: right
  ksp_norm_type: unpreconditioned

  # --------------------------------------------------
  # Schur-complement block preconditioner
  # --------------------------------------------------
  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: lower
  pc_fieldsplit_schur_precondition: selfp

  # --------------------------------------------------
  # Velocity block
  # --------------------------------------------------
  fieldsplit_0_ksp_type: preonly
  fieldsplit_0_pc_type: lu
  fieldsplit_0_pc_factor_mat_solver_type: mumps
  fieldsplit_0_pc_factor_zero_pivot: 2.22045e-14
  fieldsplit_0_pc_factor_mat_ordering_type: external

  # --------------------------------------------------
  # Pressure block
  # --------------------------------------------------
  fieldsplit_1_ksp_type: preonly
  fieldsplit_1_pc_type: jacobi
