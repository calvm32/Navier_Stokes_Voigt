solver_parameters:
  mat_type: aij
  snes_type: ksponly

  # Krylov solver
  ksp_type: fgmres
  ksp_rtol: 1e-6
  ksp_atol: 1e-12
  ksp_gmres_restart: 200

  # Block Schur
  pc_type: fieldsplit
  pc_fieldsplit_type: schur
  pc_fieldsplit_schur_fact_type: full
  pc_fieldsplit_schur_precondition: selfp
  pc_fieldsplit_schur_scale: -1

  # Velocity block
  fieldsplit_0_ksp_type: preonly
  fieldsplit_0_pc_type: hypre
  fieldsplit_0_pc_hypre_type: boomeramg

  # Pressure block (PCD)
  fieldsplit_1_ksp_type: fgmres
  fieldsplit_1_pc_type: python
  fieldsplit_1_pc_python_type: firedrake.PCDPC
  fieldsplit_1_pcd_Fp_mat_type: aij
  fieldsplit_1_pcd_u: velocity
  fieldsplit_1_pcd_dt: "{dt}"
  fieldsplit_1_pcd_Mp_pc_type: jacobi
  fieldsplit_1_pcd_Kp_pc_type: gamg
  fieldsplit_1_pcd_Kp_pc_gamg_sym_graph: true
