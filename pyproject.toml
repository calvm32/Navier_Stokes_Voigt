[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsv"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
save = "scripts.save:main"
run  = "scripts.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["solvers*", "scripts*"]