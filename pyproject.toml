[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsv"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
mysave = "navier_stokes_voigt.scripts.mysave:main"
myrun  = "navier_stokes_voigt.scripts.myrun:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["navier_stokes_voigt*"]